services:
  opencode:
    build:
      context: .
      args:
        # A Dockerfile cannot read .env, so the values arrive as build args here.
        # Without this the ARGs in the Dockerfile silently fall back to 1000 and
        # every bind-mounted file ends up owned by the wrong user.
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    container_name: contagent-opencode
    working_dir: /workspace
    volumes:
      - ./:/workspace:rw
      - ./config:/home/superuser/.config/opencode:rw
    
    read_only: true
    tmpfs:
      - /tmp:size=512M,mode=1777,exec
      - /run:size=10M,mode=1777
      - /home/superuser/.local:size=100M,mode=1777
      - /home/superuser/.config:size=100M,mode=1777
      - /home/superuser/.cache:size=100M,mode=1777
    
    networks:
      - agent-network
    
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OPENCODE_MODE=${OPENCODE_MODE}
      - HOME=/home/superuser
      - UV_SYSTEM_PYTHON=1
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OPENAI_BASE_URL=http://headroom:8787/v1
      - OPENAI_API_KEY=unused
    
    stdin_open: true
    tty: true
    depends_on:
      ollama:
        condition: service_started
      headroom:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: contagent-ollama
    volumes:
      - ollama-models:/root/.ollama:rw
    
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    networks:
      - agent-network
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

    environment:
      # Must stay in sync with limit.context in config/opencode.json. OpenCode
      # uses that number to decide when to compact; if it overestimates the real
      # window, compaction fires too late and the request overflows.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH}
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: contagent-headroom
    
    volumes:
      # Kompress-v2-base plus the ModernBERT tokenizer, pulled from HuggingFace
      # on first use (~840 MB, two separate repos). These are immutable
      # third-party model weights, not user data, so they are the only thing
      # persisted. Everything under /tmp/headroom-home -- the CCR store of
      # compressed originals, the savings log and stats -- stays on tmpfs and is
      # discarded on restart, so no prompt or file content ever survives.
      - headroom-models:/headroom-cache
    
    read_only: true
    
    tmpfs:
      # Sized to absorb HuggingFace download staging if it does not write
      # straight into HF_HOME. The ~840 MB Kompress payload itself lands on the
      # headroom-models volume, not here.
      - /tmp:size=512M,mode=1777,exec
      - /run:size=10M,mode=1777
      - /tmp/headroom-home:size=100M,mode=1777
    
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    
    environment:
      - HOME=/tmp/headroom-home
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_PORT=8787
      - HEADROOM_MODE=cache
      # HEADROOM_MODE is a real tradeoff, not a default to leave alone. "cache"
      # freezes prior turns byte-identical to protect Ollama's prefix cache, which
      # costs less on repeat requests. "token" compresses harder and should save
      # more overall when you are optimising for tokens rather than latency.
      # Try "token" once you have working savings figures to compare against.
      - HEADROOM_WORKSPACE_DIR=/tmp/headroom-home/.headroom
      - HEADROOM_CONFIG_DIR=/tmp/headroom-home/.headroom/config
      # Kompress on ONNX CPU. The image ships onnxruntime via the [proxy] extra
      # but no torch, so "auto" resolves to onnx_cpu anyway -- pin it so a future
      # torch install cannot trigger the lazy torch load that hangs requests.
      - HEADROOM_KOMPRESS_BACKEND=onnx_cpu
      # OpenCode speaks the OpenAI wire format, so it travels Headroom's
      # /v1/chat/completions route. These two vars aim that route at Ollama's
      # OpenAI-compatible endpoint (note the required /v1 suffix). The key is a
      # placeholder: Ollama does not authenticate, but Headroom will not forward
      # upstream without a non-empty credential. No ANYLLM_* vars here on purpose
      # -- that backend needs the any-llm-sdk package, which is not in the image.
      - OPENAI_TARGET_API_URL=http://ollama:11434/v1
      - OPENAI_API_KEY=unused
      # Where the HuggingFace Kompress weights are cached. Pointed at the volume
      # below so the ~840 MB download happens once, not on every restart.
      - HF_HOME=/headroom-cache
    
    networks:
      - agent-network
    
    ports:
      - "127.0.0.1:8787:8787"
    
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    
    depends_on:
      ollama:
        condition: service_started
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8787/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama-models:
    driver: local
  headroom-models:
    driver: local

networks:
  agent-network:
    driver: bridge